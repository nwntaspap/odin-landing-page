<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <!------- Navbar ------->
        <nav class="navbar">
          <div class="logo">
            <img src="Assets/logo.png" alt="A symmetric logo for our site" />
          </div>
          <ul class="links-container">
            <li><a href="#">Home</a></li>
            <li><a href="">Contact</a></li>
            <li><a href="#">About</a></li>
          </ul>
        </nav>
        <!------- Hero Section ------->
        <section class="hero">
          <div class="hero-text">
            <h1 class="hero-title">Explore new ideas from here</h1>
            <p class="hero-description">
              Lorem ipsum, dolor sit amet consectetur adipisicing elit.
              Provident dolor mollitia libero ad. Fugit magni ad nesciunt
              dignissimos nulla quae. Mollitia eum delectus sapiente excepturi?
            </p>
            <a href="#" class="cta">Get In</a>
          </div>
          <div class="hero-img">
            <img
              src="Assets/hero-img.jpg"
              alt="A man standing on top of a mountain"
            />
          </div>
        </section>
      </div>
    </header>
  </body>
</html>
